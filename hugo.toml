baseURL = 'https://desertletters.us/'
locale = 'en-us'
title = 'Desert Letters'

theme = 'papermod'


[sitemap]
changefreq = 'weekly'
filename = 'sitemap.xml'
priority = 0.8

[params]
description = "Hi, I'm Victour. I write stories, reviews, articles, or whatever else strikes me."
author = 'Victour'
images = ['images/og-cover.png'] # Default preview image for link shares

# Enable OpenGraph & Twitter Cards
enableOpenGraph = true
enableTwitterCards = true

[params.assets]
favicon = "favicon/favicon.ico"
favicon16x16 = "favicon/favicon-16x16.png"
favicon32x32 = "favicon/favicon-32x32.png"
apple_touch_icon = "favicon/apple-touch-icon.png"

[params.label]
text = "Desert Letters"
icon = "favicon/favicon-32x32.png"
iconHeight = 30

[params.homeInfoParams]
Title = "Welcome to Desert Letters!"
Content = "Hi, I'm Victour. I write stories, reviews, articles, or whatever else strikes me."

[[params.socialIcons]]
name = "github"
url = "https://github.com/VictourB"

[[menu.main]]
name = "Welcome"
url = "/about/"
weight = 10
