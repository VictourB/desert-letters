baseURL = 'https://desertletters.us/'
locale = 'en-us'
title = 'Desert Letters'

theme = 'papermod'


[sitemap]
changefreq = 'weekly'
filename = 'sitemap.xml'
priority = 0.8

[params]
favicon = "favicon.ico"
description = 'Personal essays, stories and reflections.'
author = 'Victour'
images = ['static/favicon/android-chrome-512x512.png'] # Default preview image for link shares

# Enable OpenGraph & Twitter Cards
enableOpenGraph = true
enableTwitterCards = true

[params.homeInfoParams]
Title = "Welcome to Desert Letters!"
Content = "Hi, I'm Victour. I write stories, reviews, articles, or whatever else strikes me."

[[params.socialIcons]]
name = "github"
url = "https://github.com/VictourB"

[[menu.main]]
name = "Welcome"
url = "/about/"
weight = 10
