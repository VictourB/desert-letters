{{- if .Params.comments | default true -}}
<section class="interaction-container" style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border);">

  <!-- 1. WEBMENTIONS SECTION -->
  <div id="webmentions" style="margin-bottom: 2.5rem;">
    <h3>Webmentions & Responses</h3>
    <p style="font-size: 0.9rem; opacity: 0.8;">
      Have a blog or Mastodon account? Mention this URL in your post to submit a Webmention!
    </p>
    <!-- Lightweight Webmention display container -->
    <div id="webmentions-list"></div>
  </div>

  <!-- 2. GISCUS COMMENTS SECTION -->
  <div id="giscus-comments">
    <h3>Discussion</h3>
    <!-- Paste your official snippet from giscus.app below -->
    <script src="https://giscus.app/client.js"
        data-repo="VictourB/desert-letters"
        data-repo-id="R_kgDOVEVF0w"
        data-category="General"
        data-category-id="DIC_kwDOVEVF084DIx7-"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
    </script>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/webmention.js@0.5.5/webmention.min.js"
        data-target-id="webmentions-list"
        async>
</script>


{{- end -}}
